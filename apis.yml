aid: hatchable-site
name: IntentGuard
description: IntentGuard operates IntentGuard Router, a machine-payable AI model-routing service for agents, hosted
  as a tenant app at intentguard.hatchable.site on the Hatchable AI-app platform. Before executing a task an agent
  posts it to the router, which returns the best model for quality, cost and speed, the cheapest acceptable alternative,
  a model to avoid, an optimized execution prompt, a fallback trigger and a savings estimate. A free preview endpoint
  returns task complexity, routing risk and a savings range; the paid route and a legacy image-intent preflight
  cost 0.0009 USDC per call, settled on Base mainnet through the x402 v2 protocol with no account or API key. The
  same two tools are exposed over a hosted Streamable HTTP MCP endpoint and described by a conformant A2A 1.0 agent
  card, an OpenAPI 3.1 document, an llms.txt, an OpenAI plugin manifest, an x402 service manifest and a provider-authored
  Agent Skill.
