openapi: 3.2.0
info:
  title: IntentGuard Router Router Preview API
  version: 1.0.0
  description: x402-paid AI model routing and prompt optimization. Select the best model, cheapest acceptable alternative, fallback, and optimized prompt before execution.
servers:
- url: https://intentguard.hatchable.site
tags:
- name: Router Preview
paths:
  /api/router-preview:
    post:
      operationId: previewModelRoute
      summary: Free preview of task complexity, routing risk and potential savings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - task
              properties:
                task:
                  type: string
                objective:
                  type: string
                  enum:
                  - balanced
                  - lowest_cost
                  - fastest
                  - highest_quality
                current_model_cost_tier:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        '200':
          description: Free routing preview
        '400':
          description: Invalid request
      tags:
      - Router Preview
x-discovery:
  ownershipProofs:
  - '0xcd461ac1783b22c4610d1d34f8fb01063532cb9e'
  mcp: https://intentguard.hatchable.site/api/mcp
